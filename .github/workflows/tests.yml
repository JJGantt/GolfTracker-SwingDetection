name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app-logic:
    # The app's rule logic as a plain Swift package (Tests/AppLogic). It needs
    # neither the Xcode project nor the private algorithms submodule, so the
    # checkout does not fetch submodules.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Tests/AppLogic
        run: swift test
